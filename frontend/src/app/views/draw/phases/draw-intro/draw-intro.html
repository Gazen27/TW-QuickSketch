<section class="draw-intro">
  <!-- Sample image of drawing phase -->
  <div class="tutorial-container">
    <div class="tutorial-image"><img src="img/drawing-tutorial.webp" alt="tutorial-preview"></div>
    
    <div class="line"></div>
    
    <!-- Explanation -->
    <div class="tutorial">
      <h1 class="title tutorial-title">GET STARTED</h1>
      <p class="text tutorial-text">
        Create your own masterpiece!
        <br><br>
        <span>1. Choose a category</span> that inspires you.<br>
        <span>2. Pick a word</span> from the three options.<br>
        <span>3. Draw it your way</span> before the timer runs out!
        <br><br>
        You have <span>90 seconds</span> to bring your word to life.<br>
        Don't worry about perfection, just have fun!
        <br><br>
        <span>Ready, set, draw!</span>
      </p>

      <!-- Start drawing button -->
      <button class="button start-drawing" (click)="start.emit()">START DRAWING</button>
    </div>
  </div>
</section>
