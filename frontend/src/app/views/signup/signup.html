<main class="signup">

  <!-- Form Card -->
  <div class="form-container">
	  <p class="title">Register</p>

    <!-- Entire form -->
	  <form class="form" (ngSubmit)="onSubmit()">
		  <div class="input-group">
			  <label for="username">Username</label>
			  <input type="text" name="username" id="username" [(ngModel)]="username">
		  </div>
		  <div class="input-group">
			  <label for="password">Password</label>
			  <input type="password" name="password" id="password" [(ngModel)]="password">
		  </div>
		  <button class="sign-button" type="submit">Sign up</button>
	  </form>

    <!-- Login routing -->
	  <p class="login">Already have an account?
		<a routerLink="/login">Sign in</a>
	  </p>
  </div>

  @if(errorMessage()){
    <p class="error-message" role="alert">{{errorMessage()}}</p>
  }
</main>
