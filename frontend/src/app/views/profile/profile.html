<main class="profile">

  <!-- Profile side -->
  <div class="profile-side">
    <img class="icon pink-cat" src="icons/cat/cat-dark-icon.svg">
    <img class="icon blue-cat" src="icons/cat/cat-light-icon.svg">
    <div class="user-group">
      <div class="username">{{ username() }}</div>
      <!-- Logout button -->
      <button class="logout-button" (click)="logout()">
        <div class="sign">
          <img class="dark-logout" src="icons/logout/logout-dark-icon.svg">
          <img class="light-logout" src="icons/logout/logout-light-icon.svg">
        </div>
        <div class="button-text">Logout</div>
      </button>
    </div>
  </div>
  
  <!-- Stats side -->
  <div class="stats-side">
    <div class="stats-box">

      <!-- Title and info -->
      <div class="header-row">
        <p class="title">My stats</p>
        <a class="info" routerLink="" fragment=""><img src="icons/info-icon.svg"></a>
      </div>

      <div class="stat-inner-container">
        <!-- Number of sketches -->
        <div class="stat-row">
          <p class="text stat-name">Sketches:</p>
          <p class="text stat-value">{{ sketchCount() }}</p>
        </div>
        <div class="stat-line"></div>

        <!-- Drawing score -->
        <div class="stat-row">
          <p class="text stat-name">Drawing score:</p>
          <p class="text stat-value">{{ drawingScore() }} pt</p>
        </div>
        <div class="stat-line"></div>
        
        <!-- Guess score -->
        <div class="stat-row">
          <p class="text stat-name">Guess score:</p>
          <p class="text stat-value">{{ guessedScore() }} pt</p>
        </div>
        <div class="stat-line"></div>

        <!-- Number of likes -->
        <div class="stat-row">
          <p class="text stat-name">Likes:</p>
          <p class="text stat-value">coming soon</p>
        </div>
      </div>
    </div>
  </div>
</main>
