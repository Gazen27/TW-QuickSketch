<main class="login">

  <!-- Form Card -->
  <div class="form-container">

	  <p class="title">Login</p>

    <!-- Entire form -->
	  <form class="form" (ngSubmit)="onSubmit()">
		  <div class="input-group">
			  <label for="username">Username</label>
			  <input type="text" name="username" id="username" [(ngModel)]="username">
		  </div>
		  <div class="input-group">
			  <label for="password">Password</label>
        <div class="password-container">
          <input [type]="showPassword() ? 'text' : 'password'" name="password" id="password" [(ngModel)]="password">
          <button class="toggle-password" type="button" (click)="togglePasswordVisibility()">
            @if (showPassword()) {<img src="icons/password/password-on-icon.svg">}
            @else              {<img src="icons/password/password-off-icon.svg">}
          </button>
        </div>
      </div>
		  <button class="sign-button">Sign in</button>
	  </form>

    <!-- Signup routing -->
	  <p class="signup">Don't have an account?
		<a routerLink="/signup">Sign up</a>
	  </p>
  </div>

  @if(errorMessage()){
    <p class="error-message" role="alert">{{errorMessage()}}</p>
  }
</main>
