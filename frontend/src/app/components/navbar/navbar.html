<nav class="navbar" [class.scrolled]="isScrolled">
  <!-- App logo -->
  <a class="logo" routerLink="/">QUICKSKETCH</a>

  <!-- View navigation links -->
  <div class="navbar-links">
    <a class="link" routerLink="/explore">EXPLORE</a>
    <a class="link" routerLink="/leaderboard">LEADERBOARD</a>
  </div>

  <!-- Login action -->
  <div class="navbar-actions">
    <a class="link" routerLink="/login">LOGIN</a>
  </div>

  <!-- Menu button for reduced view -->
  <button class="menu-button" (click)="toggleMenu()">
    @if (isMenuOpen){ <img src="icons/menu-open-icon.svg" alt="closedMenu"> }
    @else { <img src="/icons/menu-icon.svg" alt="openMenu"> }
  </button>

  <!-- Complete menu for reduced view -->
  @if (isMenuOpen) {
  <div class="side-menu">
    <a routerLink="/explore">EXPLORE</a>
    <a routerLink="/leaderboard">LEADERBOARD</a>
    <a routerLink="/login">LOGIN</a>
  </div>
}
</nav>
