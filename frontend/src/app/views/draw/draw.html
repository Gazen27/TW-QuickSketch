<main class="draw">

  <!-- INTRO -->
  @if (currentPhase() === 'intro') {
    <app-draw-intro (start)="showCategories()"></app-draw-intro> }

  <!-- CATEGORIES -->
  @if (currentPhase() === 'categories') {
    <app-draw-categories [categories]="categories()" (categorySelected)="showWords($event)"></app-draw-categories>}

  <!-- WORDS -->
  @if (currentPhase() === 'words') {
    <app-draw-words [words]="words()" (wordSelected)="startDrawing($event)"></app-draw-words>
  }

  <!-- DRAWING -->
  @if (currentPhase() === 'drawing') {
    <app-draw-session [word]="selectedWord()!" (finish)="onDrawingFinished($event)"></app-draw-session>
  }

  <!-- RESULTS -->
  @if (currentPhase() === 'preview') {
    <app-draw-preview [sketchUrl]="sketchUrl()!" (delete)="deleteDraft()" (publish)="publishSketch()"></app-draw-preview>
  }

  <!-- Published alert -->
  @if (showPublishSuccessDialog()) {
    <app-dialog
      title="PUBLISHED"
      message="Your sketch has been published successfully."
      mode="alert"
      confirmText="GREAT"
      (confirmed)="closePublishSuccessDialog()"
    />
  }

  <!-- Delete draft alert -->
  @if (showDeleteDialog()) {
    <app-dialog
      title="DELETE DRAFT"
      message="Are you sure you want to delete your drawing? This action cannot be undone."
      mode="confirm"
      confirmText="DELETE"
      cancelText="CANCEL"
      (confirmed)="confirmDeleteDraft()"
      (cancelled)="showDeleteDialog.set(false)"
    />
  }

</main>
